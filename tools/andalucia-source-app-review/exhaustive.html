<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../math-renderer.css"><style>body{margin:0}.audit-card{box-sizing:border-box;width:100%;max-width:1100px;padding:12px;overflow-wrap:anywhere}.audit-card img,.audit-card svg{max-width:100%;height:auto}.audit-option{padding:4px}</style></head><body><div id="mount"></div>
<script src="../../data/andalucia-user-source-index.js"></script><script src="../../data/andalucia-pau-runtime.js"></script><script src="../../data/andalucia-global-corrections.js"></script><script src="../../data/andalucia-source-app-visual-parity.js"></script><script src="../../data/andalucia-interactive-delivery-gate.js"></script><script src="../../math-renderer.js"></script><script>
(()=>{const runtime=window.ANDALUCIA_PAU_RUNTIME;const exercises=['2bach-mates','2bach-ccss'].flatMap(c=>runtime.challengeRecords(c));const R=window.MargaritaMathRenderer;const mount=document.querySelector('#mount');const result={viewport:innerWidth,exercises:exercises.length,parts:0,options:0,badChoiceParts:[],internalTokens:[],overflow:[],errors:[]};for(const ex of exercises){try{const card=document.createElement('article');card.className='audit-card';const statement=ex.learnerStatementHtml?R.html(ex.learnerStatementHtml):R.text(ex.learnerStatement||ex.officialPromptLiteral||'');let body=`<div>${statement}</div>`;for(const p of ex.parts||[]){result.parts++;const options=[p.semanticAnswer,...(p.distractors||[])];result.options+=options.length;if(options.length!==4)result.badChoiceParts.push(p.id);body+=`<section><div>${R.text(p.text||'')}</div>${options.map(o=>`<div class="audit-option">${R.text(o||'')}</div>`).join('')}<div>${(p.solutionSteps||[]).map(s=>R.text(s||'')).join('<br>')}</div></section>`}card.innerHTML=body;mount.append(card);const visible=card.textContent||'';if(/\\(?:begin|end|frac|sqrt|int|lim)\b|\b(?:matrix|system|piecewise|cases)\s*[({]/i.test(visible))result.internalTokens.push(ex.exerciseId);for(const el of card.querySelectorAll('*')){if(el.scrollWidth>el.clientWidth+2){result.overflow.push({exerciseId:ex.exerciseId,tag:el.tagName,className:String(el.className||'')});break}}card.remove()}catch(error){result.errors.push({exerciseId:ex.exerciseId,message:String(error)})}}window.__phase28Result=result;document.body.textContent=JSON.stringify(result);})();
</script></body></html>
