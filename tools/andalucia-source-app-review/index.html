<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Andalucía · revisión visual fuente–aplicación</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../math-renderer.css">
<style>
body{margin:0;background:#edf2f7;color:#172033;font-family:system-ui,sans-serif}.head{position:sticky;top:0;z-index:3;padding:14px 20px;background:#13243d;color:white}.head h1{font-size:20px;margin:0}.head p{margin:4px 0 0}.gallery{display:grid;gap:20px;padding:20px}.pair{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0001}.meta{font-weight:700;margin-bottom:10px}.reason{color:#7c2d12;margin:6px 0 12px}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.panel{min-width:0;border:1px solid #dbe3ed;border-radius:10px;padding:12px;overflow:auto}.panel h2{font-size:14px;margin:0 0 10px;color:#526176}.source{display:block;width:100%;height:auto}.statement,.part,.solution{line-height:1.55}.part{border-top:1px solid #e5e7eb;padding-top:10px;margin-top:10px}.options{display:grid;gap:6px;margin:8px 0}.option{border:1px solid #dbe3ed;border-radius:7px;padding:7px}.solution{background:#f7fafc;border-radius:8px;padding:8px;margin-top:8px}.error{color:#b91c1c}@media(max-width:700px){.columns{grid-template-columns:1fr}.gallery{padding:10px}.head{position:static}}
</style></head><body><header class="head"><h1>Revisión visual fuente oficial → +MathUp</h1><p id="page-label">Cargando…</p></header><main id="gallery" class="gallery"></main>
<script src="../../data/andalucia-user-source-index.js"></script><script src="../../data/andalucia-pau-runtime.js"></script><script src="../../data/andalucia-global-corrections.js"></script><script src="../../data/andalucia-source-app-visual-parity.js"></script><script src="../../data/andalucia-interactive-delivery-gate.js"></script><script src="../../math-renderer.js"></script>
<script>
(async()=>{const queue=await fetch('../../artifacts/andalucia-source-app-visual-parity/review-queue.json').then(r=>r.json());const page=Math.max(0,Number(new URLSearchParams(location.search).get('page')||0));const per=10;const rows=queue.slice(page*per,(page+1)*per);document.querySelector('#page-label').textContent=`Página ${page+1}/${Math.ceil(queue.length/per)} · casos ${page*per+1}–${page*per+rows.length} de ${queue.length}`;const runtime=window.ANDALUCIA_PAU_RUNTIME;const byId=new Map(runtime.exercises.map(e=>[e.exerciseId,e]));const render=(v)=>window.MargaritaMathRenderer.text(v||'');for(const row of rows){const ex=byId.get(row.exerciseId);const pair=document.createElement('article');pair.className='pair';if(!ex){pair.innerHTML=`<p class="error">No existe ${row.exerciseId}</p>`;continue}const parts=(ex.parts||[]).map(p=>`<section class="part"><strong>${p.label||''}</strong> ${render(p.text)}<div class="options">${[p.semanticAnswer,...(p.distractors||[])].map(o=>`<div class="option">${render(o)}</div>`).join('')}</div><div class="solution">${(p.solutionSteps||[]).map(s=>`<div>${render(s)}</div>`).join('')}</div></section>`).join('');const statement=ex.learnerStatementHtml?window.MargaritaMathRenderer.html(ex.learnerStatementHtml):render(ex.learnerStatement||ex.officialPromptLiteral);const nativeSource=Boolean(row.sourceFile)&&!row.sourceFile.toLowerCase().endsWith('.doc');const source=nativeSource?`<img class="source" src="../../artifacts/andalucia-source-app-visual-parity/source-captures/${row.exerciseId}.png">`:`<div class="error"><strong>${row.sourceFile?'Documento binario .doc de 2012':'Identidad de archivo fuente no resuelta'}.</strong><p>No se fuerza una reconstrucción insegura. Este caso permanece en NEEDS_HUMAN_VISUAL_REVIEW.</p><p>${render(ex.sourceProjection?.full||ex.officialPromptLiteral||'')}</p></div>`;pair.innerHTML=`<div class="meta">${row.materia} · ${row.year} · ${row.sitting||''} · ${row.questionKey} · <code>${row.exerciseId}</code></div><div class="reason">${row.failures.join(', ')||'Estructura no certificable automáticamente'}</div><div class="columns"><section class="panel"><h2>Fuente oficial · ${row.sourceFile||'sin resolver'} · página ${row.sourcePage||1}</h2>${source}</section><section class="panel"><h2>Aplicación real</h2><div class="statement">${statement}</div>${parts}</section></div>`;document.querySelector('#gallery').append(pair)}})().then(()=>{window.__galleryReady=true});
</script></body></html>
