<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revisión Andalucía · fase 2.9</title>
  <style>
    :root{font:16px/1.45 system-ui,sans-serif;color:#172033;background:#f4f6fa}body{margin:0;padding:24px}main{max-width:1400px;margin:auto}.meta,.panel{background:white;border:1px solid #dfe3eb;border-radius:12px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.sources img{width:100%;border:1px solid #ccd2dc}.status{color:#8a4b00;background:#fff3d6;padding:8px;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{padding:9px 14px;border:1px solid #9ca6b6;border-radius:8px;background:white;cursor:pointer}button[aria-pressed=true]{background:#173f78;color:white}.math-piecewise{display:inline-flex;gap:.35em}.math-piecewise-lines{display:grid}.math-piecewise-lines>span{display:grid;grid-template-columns:auto auto;gap:.7em}@media(max-width:760px){body{padding:12px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main><h1>Andalucía · decisión fuente pendiente</h1><div id="case"></div></main>
<script src="../../math-renderer.js"></script><script src="data.js"></script>
<script>
const item=window.PHASE29_REVIEW[0];const key=`phase29:${item.exerciseId}`;const saved=localStorage.getItem(key)||(item.decision==='UNRESOLVED_SOURCE'?'Fuente no concluyente':item.decision);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#case').innerHTML=`<section class="meta"><b>${esc(item.exerciseId)}</b><br>${esc(item.materia)} · ${item.year} · ${esc(item.evidence?.officialQuestion)}<p class="status">${esc(item.reason)}</p></section><div class="grid"><section class="panel"><h2>Fuentes aportadas comprobadas</h2><div class="sources">${item.sourceCandidates.map((src,i)=>`<figure><img src="${src}" alt="Candidato ${i+1}"><figcaption>${decodeURIComponent(src.split('/').pop())}</figcaption></figure>`).join('')}</div></section><section class="panel"><h2>Representación actual</h2><div>${item.learnerStatementHtml||MargaritaMathRenderer.text(item.learnerStatement)}</div>${item.parts.map(p=>`<p><b>${esc(p.label)}</b> ${MargaritaMathRenderer.text(p.text)}</p>`).join('')}</section></div><div class="actions">${['Correcto','Incorrecto','Fuente no concluyente'].map(v=>`<button data-value="${v}" aria-pressed="${saved===v}">${v}</button>`).join('')}</div>`;
document.querySelectorAll('button').forEach(button=>button.onclick=()=>{localStorage.setItem(key,button.dataset.value);document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});
</script></body></html>
