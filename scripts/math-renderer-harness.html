<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diagnóstico del renderizador matemático · Margarita Salas</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../math-notation.css" />
    <style>
      body { margin: 0; background: #f3f7fc; color: #12213b; font-family: Inter, system-ui, sans-serif; }
      main { width: min(1180px, calc(100% - 32px)); margin: 28px auto 60px; }
      header { margin-bottom: 22px; padding: 24px; border-radius: 20px; background: #fff; box-shadow: 0 12px 34px rgba(24, 66, 120, .1); }
      h1 { margin: 0 0 8px; }
      .summary { font-weight: 800; color: #08795d; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
      article { min-width: 0; padding: 18px; border: 1px solid #d8e4f3; border-radius: 16px; background: #fff; overflow-x: auto; }
      article h2 { margin: 0 0 12px; font-size: 1rem; color: #155fbd; }
      code { display: block; margin-bottom: 14px; color: #586b86; white-space: pre-wrap; overflow-wrap: anywhere; }
      .rendered { min-height: 48px; font-family: Georgia, "Times New Roman", serif; font-size: 1.22rem; font-weight: 700; line-height: 1.75; }
      .wide { grid-column: 1 / -1; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Diagnóstico del renderizador matemático</h1>
        <p>Comparación visual de la sintaxis interna con la presentación que verá el alumno.</p>
        <p class="summary" id="summary"></p>
      </header>
      <section class="grid" id="cases"></section>
    </main>
    <script src="../math-renderer.js"></script>
    <script>
      const cases = [
        ["Fracción numérica", "1/2"],
        ["Fracción algebraica", "(x+1)/(x-1)"],
        ["Potencias", "x^2; x^{10}; e^{2x+1}; (x+1)^3"],
        ["Subíndices y logaritmos", "x_1; x_{12}; a_n; a_{n+1}; log_2(x); log_{10}(x)"],
        ["Raíces", "sqrt(x); sqrt(x+1); sqrt((x+1)/(x-1)); sqrt[3](x+1)"],
        ["Límites", "lim x→a f(x); lim(x→a) f(x); lim_{x→a} f(x)"],
        ["Límites laterales", "lim x→a- f(x); lim(x→a+) f(x); lim_{x→a⁻} f(x)"],
        ["Límites en infinito", "lim x→+inf f(x); lim(x→-infinity) f(x)"],
        ["Derivadas", "f'(x); f''(x); f'''(x); dy/dx; d²y/dx²"],
        ["Integrales", "∫ f(x) dx; ∫_a^b frac{1}{x^2} dx"],
        ["Sistema", "Sistema:\\nx+y=3\\nx-y=1"],
        ["Matriz numérica", "[[1,2],[3,4]]"],
        ["Matriz algebraica", "[[1/2,x^2],[a_n,sqrt(x)]]"],
        ["Determinante", "det([[1,2],[3,4]])"],
        ["Vectores", "vector{AB}=vec{u}+v⃗"],
        ["Trigonometría", "sin^2(x)+cos^2(x)=1; tan(x)"],
        ["Conjuntos", "D={\\forall x \\in \\mathbb{R} | x \\ge 1}=[1,+infinito)"],
        ["Unión e intersección", "(A \\cup B) \\cap C"],
        ["Probabilidad condicionada", "P(A|B)=1/2"],
        ["HTML y MathML preservados", '<strong>Texto oficial:</strong> lim(x→2) (x+1)/(x-1) <math><mfrac><mn>1</mn><mn>2</mn></mfrac></math>', "html"]
      ];
      const host = document.getElementById("cases");
      cases.forEach(([label, input, mode]) => {
        const article = document.createElement("article");
        if (mode === "html") article.classList.add("wide");
        article.innerHTML = `<h2>${label}</h2><code></code><div class="rendered"></div>`;
        article.querySelector("code").textContent = input;
        article.querySelector(".rendered").innerHTML = mode === "html"
          ? MargaritaMathRenderer.html(input)
          : MargaritaMathRenderer.text(input);
        host.appendChild(article);
      });
      document.getElementById("summary").textContent = `${cases.length} grupos de prueba cargados.`;
    </script>
  </body>
</html>
